name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    # Keep real user-namespace sandbox tests on a compatible, fixed runner.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install sandbox dependency
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: python tools/check-release.py
      - run: pip install -r carlos/requirements.txt -r holohand/remote/requirements.lock
      - run: PYTHONPATH=carlos/core python -m unittest discover -s carlos/tests
      - run: python -m pytest holohand/remote/tests -q
