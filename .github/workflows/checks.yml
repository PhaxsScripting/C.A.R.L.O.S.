name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    # 24.04 blocks the user namespaces these sandbox tests need.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install sandbox and compiler test dependencies
        run: sudo apt-get update && sudo apt-get install -y bubblewrap cmake build-essential
      - run: python tools/check-release.py
      - run: pip install -r carlos/requirements.txt
      - run: PYTHONPATH=carlos/core python -m unittest discover -s carlos/tests
